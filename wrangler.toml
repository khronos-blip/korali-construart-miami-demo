name = "korali-construart-miami-demo"
main = "worker.js"
compatibility_date = "2026-09-23"
workers_dev = false

routes = [
  { pattern = "koralidigital.com/demos/construart-miami/*", zone_name = "koralidigital.com" },
  { pattern = "www.koralidigital.com/demos/construart-miami/*", zone_name = "koralidigital.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
